<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 AI 모델 테스트 페이지 🌸</title>
    <style>
        /* 전체적인 배경과 글씨 스타일 (핑크 테마) */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #fff0f5; /* 연한 핑크 배경 */
            color: #4a0e17; /* 짙은 버건디/핑크빛 글씨 */
            text-align: center;
            padding: 30px;
            margin: 0;
        }

        /* 큼직하고 예쁜 메인 제목 */
        h1 {
            font-size: 3.5rem; /* 글씨 아주 크게 */
            color: #ff69b4; /* 핫핑크 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5rem;
            color: #db7093;
            margin-bottom: 30px;
        }

        /* 시작 버튼 스타일 */
        button {
            font-size: 2rem; /* 버튼 글씨 크게 */
            font-weight: bold;
            padding: 20px 50px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px; /* 둥글둥글한 버튼 */
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #ff1493; /* 마우스 올리면 더 진한 핑크 */
            transform: translateY(-3px);
            box-shadow: 0 15px 20px rgba(255, 105, 180, 0.4);
        }

        /* 웹캠 화면을 감싸는 박스 (크고 아름답게!) */
        #webcam-container {
            margin: 40px auto;
            border: 10px solid #ffb6c1; /* 연분홍색 두꺼운 테두리 */
            border-radius: 20px;
            width: 640px;  /* 화면 크기 크게 */
            height: 480px; /* 화면 크기 크게 */
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* 실제 웹캠 캔버스 크기 조절 */
        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            transform: scaleX(-1); /* 거울 모드 (좌우 반전) */
        }

        /* AI가 판단한 결과가 출력되는 곳 */
        #label-container {
            margin: 30px auto;
            max-width: 640px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 3px dashed #ff69b4;
        }

        /* 결과 창 안의 개별 클래스 글씨 크기 */
        #label-container div {
            font-size: 2.5rem; /* 인식 결과 글씨 아주 크게 */
            font-weight: bold;
            margin: 15px 0;
            color: #ff1493;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h1>🌸 AI 모델 실시간 테스트 🌸</h1>
    <p>아래 버튼을 눌러 카메라를 켜고 생성한 AI 모델을 테스트해 보세요!</p>
    
    <button type="button" onclick="init()">📷 AI 카메라 시작하기</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // ⚠️ 선생님! 여기에 가지고 계신 티쳐블 머신 주소를 꼭 넣어주세요! 끝에 '/'가 붙어있어야 합니다.
        const URL = "https://teachablemachine.withgoogle.com/models/WiCyoaCIY/"; 

        let model, webcam, labelContainer, maxPredictions;

        // 카메라 및 모델 초기화 함수
        async function init() {
         
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // AI 모델 로드
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 웹캠 설정 (가로 640, 세로 480 대화면 설정)
            const flip = true; 
            webcam = new tmImage.Webcam(640, 480, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 화면에 카메라 붙이기
            document.getElementById("webcam-container").innerHTML = ""; // 기존 내용 초기화
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            // 결과창 레이블 생성
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // 초기화
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        // 예측 및 화면 표시 함수
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // 확률을 퍼센트(%) 형태로 변환하여 보기 쉽게 표시
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(0); 
                
                labelContainer.childNodes[i].innerHTML = `
                    <span>✨ ${className}</span>
                    <span>${probability}%</span>
                `;
            }
        }
    </script>
</body>
</html>
