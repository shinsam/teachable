<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>🌿 AI 모델 스마트 테스트 페이지 🌿</title>
    
    <style>
        /* 💡 웹페이지의 전체적인 배경색과 기본 글자색을 설정합니다 (그린 테마) */
        body {
            font-family: 'Malgun Gothic', sans-serif; /* 글꼴을 맑은 고딕으로 설정합니다. */
            background-color: #1a3c2a; /* 화면 배경을 짙은 초록색(칠판 색상)으로 설정합니다. */
            color: #ecf0f1; /* 기본 글자 색상을 밝은 회색으로 설정합니다. */
            text-align: center; /* 모든 텍스트를 화면 중앙에 정렬합니다. */
            padding: 30px; /* 화면 가장자리에 여백을 줍니다. */
            margin: 0; /* 기본 여백을 없앱니다. */
        }

        /* 💡 메인 제목(h1) 스타일 */
        h1 {
            font-size: 3.5rem; /* 제목 글씨 크기를 아주 크게 설정합니다. */
            color: #2ecc71; /* 제목 색상을 선명한 에메랄드 초록색으로 설정합니다. */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* 글씨 뒤에 은은한 그림자 효과를 줍니다. */
            margin-bottom: 10px; /* 아래쪽 컴포넌트와의 간격을 줍니다. */
        }

        /* 💡 서브 설명문(p) 스타일 */
        p {
            font-size: 1.5rem; /* 글씨 크기를 설정합니다. */
            color: #a9dfbf; /* 글씨 색상을 연한 초록색으로 설정합니다. */
            margin-bottom: 30px; /* 아래쪽과의 간격을 줍니다. */
        }

        /* 💡 카운트다운 숫자가 표시되는 영역의 스타일 */
        #countdown-text {
            font-size: 5rem; /* 숫자가 잘 보이도록 글씨 크기를 엄청나게 키웁니다. */
            font-weight: bold; /* 글씨를 두껍게 만듭니다. */
            color: #ccff00; /* 형광 라임색으로 설정합니다. */
            height: 120px; /* 공간이 들쭉날쭉 변하지 않게 고정 높이를 줍니다. */
            margin-top: 10px; /* 위쪽 여백을 줍니다. */
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.5); /* 네온사인 효과를 줍니다. */
        }

        /* 💡 작동 버튼(Button) 스타일 */
        button {
            font-size: 2rem; /* 버튼 안의 글씨 크기를 키웁니다. */
            font-weight: bold; /* 버튼 글씨를 두껍게 합니다. */
            padding: 20px 50px; /* 버튼 안쪽에 여백을 넉넉히 줍니다. */
            background-color: #27ae60; /* 버튼 기본 색상을 차분한 초록색으로 설정합니다. */
            color: white; /* 버튼 글자색을 흰색으로 합니다. */
            border: none; /* 테두리 선을 없앱니다. */
            border-radius: 10px; /* 네모난 버튼의 모서리를 살짝 부드럽게 깎아줍니다. */
            cursor: pointer; /* 마우스를 올렸을 때 손가락 모양으로 바뀌게 합니다. */
            box-shadow: 0 5px 0 #1e8449; /* 버튼 아래쪽에 입체감 있는 그림자를 만듭니다. */
            transition: all 0.1s ease; /* 애니메이션 속도를 부드럽게 합니다. */
            margin: 10px; /* 버튼 사이의 간격을 줍니다. */
        }

        /* 💡 마우스를 올렸을 때 버튼 변화 */
        button:hover {
            background-color: #2ecc71; /* 조금 더 밝은 연두색으로 바뀝니다. */
        }

        /* 💡 비활성화(눌러도 반응 없는 상태)된 버튼 스타일 */
        button:disabled {
            background-color: #7f8c8d; /* 회색 배경으로 바뀝니다. */
            box-shadow: none; /* 아래쪽 입체감 그림자를 없앱니다. */
            cursor: not-allowed; /* 마우스를 올려도 금지 표시가 뜨게 합니다. */
        }

        /* 💡 웹캠 영상이 나오는 상자 스타일 */
        #webcam-container {
            margin: 20px auto; /* 상자를 화면 가운데로 정렬합니다. */
            border: 5px solid #2ecc71; /* 테두리를 형광 연두색 두꺼운 선으로 만듭니다. */
            border-radius: 15px; /* 테두리 모서리를 둥글게 만듭니다. */
            width: 640px;  /* 가로 크기를 640픽셀 대화면으로 설정합니다. */
            height: 480px; /* 세로 크기를 480픽셀 대화면으로 설정합니다. */
            overflow: hidden; /* 박스 밖으로 튀어나오는 영상은 숨깁니다. */
            background-color: #000; /* 카메라가 켜지기 전까진 검은색 바탕으로 둡니다. */
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); /* 상자 주변에 네온 광원 효과를 줍니다. */
        }

        /* 💡 실제 화면에 그려지는 카메라 화면(캔버스) 스타일 */
        #webcam-container canvas {
            width: 100% !important; /* 상자 가로 크기에 꽉 맞춥니다. */
            height: 100% !important; /* 상자 세로 크기에 꽉 맞춥니다. */
            transform: scaleX(-1); /* 카메라가 거울처럼 좌우 반전되어 보이도록 만듭니다. */
        }

        /* 💡 찰칵! 스냅샷이 찍혀 화면이 멈췄을 때 강조 효과 스타일 */
        .snapshot-active {
            border: 5px solid #ccff00 !important; /* 테두리를 라임색으로 바꿉니다. */
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.8) !important; /* 네온 불빛을 더 강하게 뿜어냅니다. */
        }

        /* 💡 인공지능 예측 결과가 텍스트로 찍히는 텍스트 박스 스타일 */
        #label-container {
            margin: 20px auto; /* 화면 가운데 정렬 */
            max-width: 640px; /* 가로 최대 길이를 카메라 상자와 맞춥니다. */
            background: #0d2116; /* 짙은 검은색에 가까운 초록색 배경으로 만듭니다. */
            padding: 25px; /* 안쪽 여백 */
            border-radius: 15px; /* 모서리 라운딩 */
            border: 2px solid #2ecc71; /* 테두리 선 생성 */
            min-height: 80px; /* 텍스트가 바뀔 때 높이가 늘어났다 줄어들지 않게 최소 높이를 고정합니다. */
        }

        /* 💡 결과 창 안의 글씨 스타일 */
        #label-container div {
            font-size: 2.8rem; /* 결과 글씨 크기를 크게 만듭니다. */
            font-weight: bold; /* 글씨를 굵게 합니다. */
            color: #ccff00; /* 형광 라임색 글씨 */
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.7); /* 글씨가 스스로 빛나는 효과를 줍니다. */
            text-align: center; /* 글씨 가운데 정렬 */
        }
    </style>
</head>
<body>

    <h1>🌿 AI 가위바위보 스마트 스냅샷 판정 🌿</h1>
    
    <button type="button" id="start-cam-btn" onclick="init_camera()">1. 카메라 시스템 가동</button>
    <button type="button" id="play-btn" onclick="start_countdown()" disabled>2. 가위바위보 대결 시작</button>
    
    <div id="countdown-text">시스템을 시작하려면 버튼을 누르세요.</div>
    
    <div id="webcam-container"></div>
    <div id="label-container"><div id="result">결과 대기 중...</div></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // ⚠️ 선생님의 실제 티쳐블 머신 모델 주소를 입력하는 곳입니다. 끝에 '/' 문자가 꼭 들어가야 정상 작동합니다.
        const URL = "https://teachablemachine.withgoogle.com/models/WiCyoaCIY/"; 

        let model, webcam, maxPredictions; // AI 모델, 카메라 객체, 클래스 개수를 담을 글로벌 변수 선언
        let isRunning = false; // 실시간 카메라 화면을 계속 업데이트할지 멈출지 결정하는 제어 플래그 변수

        // 💡 컴퓨터 스피커로 한국어 안내 음성을 내보내는 함수 (TTS 기능)
        function speak(text) {
            if (typeof SpeechSynthesisUtterance === "undefined") return; // 브라우저가 TTS 기능을 지원 안 하면 함수 종료
            window.speechSynthesis.cancel(); // 현재 흘러나오고 있는 음성이 있다면 즉시 멈춥니다.
            const utterance = new SpeechSynthesisUtterance(text); // 말할 문장을 객체로 생성합니다.
            utterance.lang = "ko-KR"; // 말하는 언어 국가를 대한민국 한국어로 세팅합니다.
            utterance.rate = 1.2;     // 긴장감을 위해 말하는 속도를 기본(1.0)보다 약간 빠른 1.2로 설정합니다.
            window.speechSynthesis.speak(utterance); // 스피커로 최종 음성을 출력합니다.
        }

        // 💡 [1단계] 카메라와 인공지능 두뇌(모델)를 준비시키는 초기화 함수
        async function init_camera() {
            document.getElementById("start-cam-btn").disabled = true; // 중복 클릭을 방지하기 위해 '1번 버튼'을 비활성화합니다.
            document.getElementById("countdown-text").innerText = "AI 시스템 로딩 중..."; // 상태를 화면에 표기합니다.

            const modelURL = URL + "model.json"; // 티쳐블 머신으로부터 모델 구조 파일을 지정합니다.
            const metadataURL = URL + "metadata.json"; // 클래스 이름 등이 적힌 메타데이터 파일을 지정합니다.

            model = await tmImage.load(modelURL, metadataURL); // 구글 서버에서 AI 모델 파일을 브라우저 메모리로 업로드합니다.
            maxPredictions = model.getTotalClasses(); // 내가 학습시킨 손모양 클래스(가위,바위,보)가 총 몇 개인지 알아내 변수에 넣습니다.

            const flip = true; // 화면을 좌우 반전 시킬지 여부를 참(true)으로 지정합니다.
            webcam = new tmImage.Webcam(640, 480, flip); // 가로 640, 세로 480 크기의 웹캠 객체를 생성합니다.
            await webcam.setup(); // PC에 연결된 웹캠 장치 하드웨어의 접근 권한을 요청하고 셋업합니다.
            await webcam.play(); // 카메라 스트리밍 영상을 가동합니다.
            
            document.getElementById("webcam-container").appendChild(webcam.canvas); // 검은색 상자 안에 실제 카메라 화면 화면을 붙여 넣습니다.
            document.getElementById("countdown-text").innerText = "시스템 준비 완료! 대결 버튼을 누르세요.";
            document.getElementById("play-btn").disabled = false; // 준비가 끝났으므로 비활성화 상태였던 '2번 게임 버튼'을 잠금 해제합니다.
            
            isRunning = true; // 카메라 영상 갱신 플래그를 활성화합니다.
            window.requestAnimationFrame(loop); // 브라우저에게 카메라 화면을 끊임없이 그리라는 반복 명령을 내립니다.
        }

        // 💡 브라우저가 재생되는 동안 매 프레임마다 카메라의 새로운 이미지를 받아와 화면에 덮어씌우는 루프 함수
        async function loop() {
            if (isRunning) { // 만약 화면 정지(스냅샷) 상태가 아니라면
                webcam.update(); // 웹캠 영상을 최신 상태로 한 장 업데이트합니다.
                window.requestAnimationFrame(loop); // 다음 화면도 계속 그리도록 루프를 유지합니다.
            }
        }

        // 💡 [2단계] 게임 시작 버튼을 누르면 구동되는 3, 2, 1 카운트다운 타이머 함수
        function start_countdown() {
            document.getElementById("play-btn").disabled = true; // 카운트다운 도중에 또 버튼을 누르지 못하게 막아버립니다.
            document.getElementById("webcam-container").classList.remove("snapshot-active"); // 이전 판의 스냅샷 테두리 효과를 지워 리셋합니다.
            document.getElementById("result").innerText = "카메라를 보고 무엇을 낼지 준비하세요!";
            
            // 만약 이전 판정 때문에 카메라 루프가 멈춰 있었다면 다시 가동시킵니다.
            if(!isRunning) {
                isRunning = true; // 플래그를 다시 켬
                webcam.play(); // 웹캠 플레이 재생
                window.requestAnimationFrame(loop); // 루프 가동
            }

            let count = 3; // 타이머 카운트 변수를 3으로 세팅합니다.
            document.getElementById("countdown-text").innerText = count; // 화면에 숫자 "3"을 찍습니다.
            speak(count.toString()); // 스피커로 "삼" 하고 소리를 냅니다.

            // 💡 자바스크립트 내장 타이머 기능으로 1000밀리초(1초)마다 내부 코드를 반복 실행합니다.
            let timer = setInterval(() => {
                count--; // 숫자를 1씩 뺍니다. (3 -> 2 -> 1)
                if (count > 0) { // 숫자가 0보다 크다면 (2나 1일 때)
                    document.getElementById("countdown-text").innerText = count; // 화면에 숫자를 바꾸어 찍고
                    speak(count.toString()); // 스피커로 해당 숫자 소리를 출력합니다 ("이", "일")
                } else { // 숫자가 드디어 0이 되었다면 (카운트다운 종료 순간)
                    clearInterval(timer); // 1초마다 반복되던 타이머 작동을 강제로 정지시킵니다.
                    document.getElementById("countdown-text").innerText = "제출!!"; // 화면에 "제출!!" 문구를 표시합니다.
                    speak("제출"); // 스피커로 "제출"이라고 크게 외칩니다.
                    
                    // 💥 딱 제출을 외치는 바로 그 순간의 카메라 화면을 얼려버리고 판정을 시작하는 함수를 호출합니다.
                    take_snapshot();
                }
            }, 1000); // 1000ms = 1초 주기를 의미합니다.
        }

        // 💡 [3단계] "제출" 순간에 작동하여 화면을 정지(스냅샷)시키고 AI 연산을 수행하는 핵심 함수
        async function take_snapshot() {
            isRunning = false; // 무한 반복되던 영상 갱신 루프(`loop`)를 false로 막아 화면을 사진처럼 정지시킵니다.
            webcam.pause();    // 웹캠 하드웨어 장치 자체도 잠시 일시정지 모드로 바꿉니다.
            
            document.getElementById("webcam-container").classList.add("snapshot-active"); // 화면 테두리를 네온 라임색으로 번쩍이게 해 강조 효과를 줍니다.

            // 🧠 멈춘 순간의 캔버스 화면 한 장을 텐서플로우 AI 두뇌 엔진에 집어넣어 가위,바위,보 확률을 연산합니다.
            const prediction = await model.predict(webcam.canvas);
            
            let highestClass = ""; // 가장 확률이 높은 클래스 이름을 담을 빈 변수
            let highestProbability = 0; // 가장 높은 확률 값을 비교하기 위해 0으로 초기화한 변수

            // 티쳐블 머신 클래스 개수만큼 반복하며 어떤 손모양의 확률이 가장 높은지 검사합니다.
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProbability) { // 만약 i번째 클래스의 확률이 이전 기록보다 높다면
                    highestProbability = prediction[i].probability; // 가장 높은 확률 값을 i번째 확률로 업데이트합니다.
                    highestClass = prediction[i].className; // 가장 높은 클래스의 이름(예: '바위')도 저장합니다.
                }
            }

            const resultDiv = document.getElementById("result"); // 결과 텍스트가 들어갈 레이아웃 엘리먼트를 가져옵니다.
            
            // 인공지능의 판단 신뢰도가 70%(0.7)를 넘을 때만 정상 판정으로 인정합니다.
            if (highestProbability > 0.7) {
                const percent = (highestProbability * 100).toFixed(0); // 0.954 같은 소수점을 사람이 보기 편하게 '95%' 같은 정수 퍼센트로 바꿉니다.
                resultDiv.innerHTML = `🧐 판정 결과: [${highestClass}] (${percent}% 일치)`; // 화면에 판정 결과를 출력합니다.
                speak(`결과는 ${highestClass} 입니다.`); // 스피커로 결과 손모양을 읽어줍니다.
            } else { // 손 모양이 이상해서 확률이 모두 70% 미만으로 낮게 나왔다면
                resultDiv.innerHTML = "❓ 음.. 잘 모르겠어요! 다시 시도해 주세요."; // 판정 불가 메시지를 띄웁니다.
                speak("다시 시도해 주세요."); // 스피커로 안내 음성을 보냅니다.
            }

            // 💡 결과를 확인하고 다음 게임을 준비할 수 있도록 3000밀리초(3초) 뒤에 조작 버튼을 원상복구합니다.
            setTimeout(() => {
                document.getElementById("play-btn").disabled = false; // 게임 버튼을 다시 누를 수 있게 활성화합니다.
                document.getElementById("countdown-text").innerText = "다시 하려면 버튼을 누르세요!"; // 문구를 변경합니다.
            }, 3000); // 3초의 딜레이 타임을 줍니다.
        }
    </script>
</body>
</html>
